<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Session Notes — D&amp;D Wiki</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1510;
      color: #d4c89a;
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #221e18;
      border: 1px solid #c9a84c44;
      border-radius: 6px;
      padding: 2.5rem;
      width: 100%;
      max-width: 800px;
      margin-top: 2rem;
    }

    h1 {
      font-size: 1.6rem;
      color: #c9a84c;
      margin-bottom: 0.4rem;
      letter-spacing: 0.04em;
    }

    h2 { font-size: 1.15rem; color: #d4c89a; margin-bottom: 0.3rem; }

    p.subtitle {
      font-size: 0.9rem;
      color: #8c7b5a;
      margin-bottom: 1.6rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #a89870;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    textarea {
      width: 100%;
      min-height: 280px;
      background: #14110e;
      border: 1px solid #c9a84c44;
      border-radius: 4px;
      color: #d4c89a;
      font-family: 'Georgia', serif;
      font-size: 0.95rem;
      line-height: 1.6;
      padding: 1rem;
      resize: vertical;
      outline: none;
    }

    textarea:focus { border-color: #c9a84c88; }

    button.btn-primary {
      margin-top: 1.2rem;
      background: #c9a84c;
      color: #1a1510;
      border: none;
      border-radius: 4px;
      padding: 0.7rem 2rem;
      font-family: 'Georgia', serif;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: background 0.15s;
    }

    button.btn-primary:hover { background: #e0bc60; }
    button.btn-primary:disabled { background: #5a4e30; color: #8c7b5a; cursor: not-allowed; }

    /* Loading state */
    #state-loading { text-align: center; padding: 3rem 0; }

    .spinner {
      display: inline-block;
      width: 48px;
      height: 48px;
      border: 4px solid #c9a84c22;
      border-top-color: #c9a84c;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 1.2rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #state-loading p { color: #8c7b5a; font-style: italic; }

    /* Review state */
    .empty-notice {
      color: #8c7b5a;
      font-style: italic;
      padding: 2rem 0;
      text-align: center;
    }

    .proposal {
      border: 1px solid #c9a84c33;
      border-radius: 5px;
      padding: 1.2rem;
      margin-bottom: 1.5rem;
    }

    .proposal-header {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 0.6rem;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: bold;
      letter-spacing: 0.08em;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      text-transform: uppercase;
    }

    .badge-update { background: #2a5a2a; color: #7fc97f; }
    .badge-create { background: #1a3a5a; color: #7fbcd4; }

    .rationale {
      font-size: 0.88rem;
      color: #a89870;
      font-style: italic;
      margin-bottom: 0.8rem;
      line-height: 1.5;
    }

    .diff-section { display: flex; gap: 1rem; margin-bottom: 0.8rem; }

    .diff-pane {
      flex: 1;
      min-width: 0;
    }

    .diff-pane-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #8c7b5a;
      margin-bottom: 0.3rem;
    }

    .diff-pane pre {
      background: #14110e;
      border: 1px solid #c9a84c22;
      border-radius: 3px;
      padding: 0.8rem;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      line-height: 1.5;
      color: #d4c89a;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 220px;
      overflow-y: auto;
    }

    .diff-pane.before pre { border-color: #6b3333; }
    .diff-pane.after pre { border-color: #336b33; }

    .diff-pane.after textarea {
      background: #14110e;
      border: 1px solid #336b33;
      border-radius: 3px;
      padding: 0.8rem;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      line-height: 1.5;
      color: #d4c89a;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 80px;
      max-height: 220px;
      overflow-y: auto;
      width: 100%;
      resize: vertical;
      outline: none;
    }
    .diff-pane.after textarea:focus { border-color: #55aa55; }

    .badge-edited { background: #3a3a1a; color: #c9c97f; }

    .title-edit-row { margin-bottom: 0.8rem; }
    .title-edit-row label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #8c7b5a;
      margin-bottom: 0.3rem;
    }
    .title-edit-row input {
      width: 100%;
      background: #14110e;
      border: 1px solid #c9a84c44;
      border-radius: 3px;
      color: #d4c89a;
      font-family: 'Georgia', serif;
      font-size: 0.95rem;
      padding: 0.4rem 0.6rem;
      outline: none;
    }
    .title-edit-row input:focus { border-color: #c9a84c88; }
    .slug-preview {
      font-size: 0.75rem;
      color: #8c7b5a;
      margin-top: 0.3rem;
      font-family: 'Courier New', monospace;
    }
    .slug-input-wrapper {
      display: flex;
      align-items: center;
      gap: 0;
    }
    .slug-prefix {
      background: #14110e;
      border: 1px solid #c9a84c44;
      border-right: none;
      border-radius: 3px 0 0 3px;
      color: #8c7b5a;
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
      padding: 0.4rem 0.4rem 0.4rem 0.6rem;
      line-height: 1;
    }
    .slug-edit {
      flex: 1;
      background: #14110e;
      border: 1px solid #c9a84c44;
      border-left: none;
      border-radius: 0 3px 3px 0;
      color: #d4c89a;
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
      padding: 0.4rem 0.6rem;
      outline: none;
      min-width: 0;
    }
    .slug-edit:focus { border-color: #c9a84c88; }

    .approve-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.6rem;
    }

    .approve-row input[type="checkbox"] { accent-color: #c9a84c; width: 1.1rem; height: 1.1rem; cursor: pointer; }
    .approve-row label { font-size: 0.9rem; color: #a89870; cursor: pointer; text-transform: none; letter-spacing: 0; margin: 0; }

    /* Success state */
    #state-success ul { list-style: none; padding: 0; margin: 1rem 0; }
    #state-success li { margin: 0.4rem 0; }
    #state-success a { color: #c9a84c; }

    .error-text { color: #d47c7c; font-size: 0.9rem; margin-top: 0.5rem; }

    .paste-notice {
      font-size: 0.82rem;
      color: #7fc97f;
      margin-top: 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    /* Visibility */
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card">

    <!-- State 1: Input -->
    <div id="state-input">
      <h1>Upload Session Notes</h1>
      <p class="subtitle">Paste your session notes below. Claude will identify which wiki pages to update and propose changes for your review.</p>

      <label for="notes">Session Notes</label>
      <textarea
        id="notes"
        name="notes"
        placeholder="The party arrived at Stormhaven under cover of night…"
      ></textarea>
      <p id="paste-notice" class="paste-notice hidden"></p>

      <button type="button" class="btn-primary" id="analyze-btn">Analyze Notes</button>
      <p id="input-error" class="error-text hidden"></p>
    </div>

    <!-- State 2: Loading -->
    <div id="state-loading" class="hidden">
      <div class="spinner"></div>
      <p>Claude is reading your notes and identifying wiki changes&hellip;</p>
    </div>

    <!-- State 3: Review -->
    <div id="state-review" class="hidden">
      <h1>Review Proposed Changes</h1>
      <p class="subtitle" id="review-subtitle"></p>

      <div id="proposals-list"></div>

      <button type="button" class="btn-primary" id="apply-btn">Apply Approved Changes</button>
      <p id="apply-error" class="error-text hidden"></p>
    </div>

    <!-- State 4: Success -->
    <div id="state-success" class="hidden">
      <h1>Changes Applied</h1>
      <p class="subtitle" id="success-subtitle"></p>
      <ul id="success-list"></ul>
      <div id="success-errors"></div>
      <button type="button" class="btn-primary" id="back-btn" style="margin-top:1.5rem">Upload Another</button>
    </div>

  </div>

  <script src="/slugify.js"></script>
  <script>
    const stateInput   = document.getElementById('state-input');
    const stateLoading = document.getElementById('state-loading');
    const stateReview  = document.getElementById('state-review');
    const stateSuccess = document.getElementById('state-success');

    function show(el) {
      [stateInput, stateLoading, stateReview, stateSuccess].forEach(s => s.classList.add('hidden'));
      el.classList.remove('hidden');
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // --- Analyze ---

    document.getElementById('analyze-btn').addEventListener('click', async () => {
      const notes = document.getElementById('notes').value.trim();
      const errEl = document.getElementById('input-error');
      errEl.classList.add('hidden');

      if (!notes) {
        errEl.textContent = 'Please paste some session notes before analyzing.';
        errEl.classList.remove('hidden');
        return;
      }

      show(stateLoading);

      try {
        const res = await fetch('/upload/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ notes }),
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || `Server error ${res.status}`);
        }

        const { proposals } = await res.json();
        renderReview(proposals);
      } catch (err) {
        show(stateInput);
        errEl.textContent = `Analysis failed: ${err.message}`;
        errEl.classList.remove('hidden');
      }
    });

    function renderReview(proposals) {
      const list = document.getElementById('proposals-list');
      const subtitle = document.getElementById('review-subtitle');
      list.innerHTML = '';

      if (!proposals || proposals.length === 0) {
        subtitle.textContent = 'Claude found no wiki pages that need updating for these notes.';
        document.getElementById('apply-btn').classList.add('hidden');
        show(stateReview);
        return;
      }

      subtitle.textContent = `${proposals.length} proposed change${proposals.length > 1 ? 's' : ''} — approve or reject each, then click Apply.`;
      document.getElementById('apply-btn').classList.remove('hidden');

      proposals.forEach((p, i) => {
        const action = p.action === 'create' ? 'NEW' : 'UPDATE';
        const badgeClass = p.action === 'create' ? 'badge-create' : 'badge-update';

        const titleEditRow = p.action === 'create' ? `
          <div class="title-edit-row">
            <label for="title-edit-${i}">Page Title</label>
            <input type="text" id="title-edit-${i}" class="title-edit" value="${escHtml(p.title || '')}">
          </div>` : '';

        const slugEditRow = `
          <div class="title-edit-row">
            <label for="slug-edit-${i}">URL Path</label>
            <div class="slug-input-wrapper">
              <span class="slug-prefix">/</span>
              <input type="text" id="slug-edit-${i}" class="slug-edit" value="${escHtml(p.slug || '')}">
            </div>
          </div>`;

        const div = document.createElement('div');
        div.className = 'proposal';
        div.dataset.proposal = JSON.stringify(p);
        div.innerHTML = `
          <div class="proposal-header">
            <span class="badge ${badgeClass}">${action}</span>
            <h2 class="proposal-title">${escHtml(p.title || p.slug)}</h2>
            <span class="badge badge-edited hidden edited-badge">Edited</span>
          </div>
          <p class="rationale">${escHtml(p.rationale || '')}</p>
          ${titleEditRow}
          ${slugEditRow}
          <div class="diff-section">
            <div class="diff-pane before">
              <div class="diff-pane-label">Before</div>
              <pre>${escHtml(p.current_content || '(new page)')}</pre>
            </div>
            <div class="diff-pane after">
              <div class="diff-pane-label">After (editable)</div>
              <textarea class="proposed-edit">${escHtml(p.proposed_content || '')}</textarea>
            </div>
          </div>
          <div class="approve-row">
            <input type="checkbox" id="approve-${i}" class="approve-cb" checked>
            <label for="approve-${i}">Approve this change</label>
          </div>
        `;
        list.appendChild(div);

        const markEdited = () => div.querySelector('.edited-badge').classList.remove('hidden');
        div.querySelector('.proposed-edit').addEventListener('input', markEdited);

        const slugInput = div.querySelector('.slug-edit');
        slugInput.addEventListener('input', () => {
          markEdited();
          div.dataset.currentSlug = slugInput.value;
          slugInput.dataset.userEdited = 'true';
        });

        if (p.action === 'create') {
          const titleInput = div.querySelector('.title-edit');
          const h2 = div.querySelector('.proposal-title');
          titleInput.addEventListener('input', () => {
            markEdited();
            h2.textContent = titleInput.value || p.slug;
            div.dataset.currentTitle = titleInput.value;
            if (!slugInput.dataset.userEdited) {
              const newSlug = slugify(titleInput.value, p.slug);
              slugInput.value = newSlug;
              div.dataset.currentSlug = newSlug;
            }
          });
        }
      });

      show(stateReview);
    }

    // --- Apply ---

    document.getElementById('apply-btn').addEventListener('click', async () => {
      const errEl = document.getElementById('apply-error');
      errEl.classList.add('hidden');

      const approved = [];
      document.querySelectorAll('.proposal').forEach((el) => {
        const cb = el.querySelector('.approve-cb');
        if (cb && cb.checked) {
          const proposal = JSON.parse(el.dataset.proposal);
          proposal.proposed_content = el.querySelector('.proposed-edit').value;
          proposal.slug = el.dataset.currentSlug || proposal.slug;
          if (proposal.action === 'create') {
            const titleInput = el.querySelector('.title-edit');
            if (titleInput) {
              proposal.title = titleInput.value || proposal.title;
            }
          }
          approved.push(proposal);
        }
      });

      if (approved.length === 0) {
        errEl.textContent = 'No changes selected. Check at least one proposal to apply.';
        errEl.classList.remove('hidden');
        return;
      }

      document.getElementById('apply-btn').disabled = true;
      show(stateLoading);

      try {
        const res = await fetch('/upload/apply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ proposals: approved }),
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || `Server error ${res.status}`);
        }

        const { applied, errors } = await res.json();
        renderSuccess(applied, errors);
      } catch (err) {
        show(stateReview);
        document.getElementById('apply-btn').disabled = false;
        errEl.textContent = `Apply failed: ${err.message}`;
        errEl.classList.remove('hidden');
      }
    });

    function renderSuccess(applied, errors) {
      const subtitle = document.getElementById('success-subtitle');
      const list = document.getElementById('success-list');
      const errDiv = document.getElementById('success-errors');
      list.innerHTML = '';
      errDiv.innerHTML = '';

      subtitle.textContent = `${applied.length} change${applied.length !== 1 ? 's' : ''} applied successfully.`;

      applied.forEach(p => {
        const li = document.createElement('li');
        li.innerHTML = `&#10003; <a href="/${p.slug}" target="_blank">${escHtml(p.title)}</a>`;
        list.appendChild(li);
      });

      if (errors && errors.length > 0) {
        errDiv.innerHTML = `<p class="error-text" style="margin-top:1rem">${errors.length} change${errors.length !== 1 ? 's' : ''} could not be applied:</p>`;
        errors.forEach(e => {
          const p = document.createElement('p');
          p.className = 'error-text';
          p.textContent = `  ${e.title}: ${e.error}`;
          errDiv.appendChild(p);
        });
      }

      show(stateSuccess);
    }

    // --- Reset ---

    document.getElementById('back-btn').addEventListener('click', () => {
      document.getElementById('notes').value = '';
      document.getElementById('input-error').classList.add('hidden');
      document.getElementById('paste-notice').classList.add('hidden');
      document.getElementById('apply-btn').disabled = false;
      show(stateInput);
    });

    // --- Paste: preserve rich-text formatting as Markdown ---

    /**
     * Convert a DOM node to Markdown text.
     * Called recursively; listDepth tracks nesting for indented lists.
     */
    function domToMarkdown(node, listDepth) {
      listDepth = listDepth || 0;

      // Plain text node
      if (node.nodeType === 3) {
        // Collapse whitespace but don't trim — surrounding elements handle spacing
        return node.textContent.replace(/[ \t\r\n]+/g, ' ');
      }

      if (node.nodeType !== 1) return ''; // skip comments, etc.

      const tag = node.tagName.toLowerCase();

      // Skip non-content nodes
      if (['script', 'style', 'head', 'meta', 'link'].includes(tag)) return '';

      const children = (depth) =>
        Array.from(node.childNodes).map(c => domToMarkdown(c, depth !== undefined ? depth : listDepth)).join('');

      switch (tag) {
        case 'h1': return `# ${children().trim()}\n\n`;
        case 'h2': return `## ${children().trim()}\n\n`;
        case 'h3': return `### ${children().trim()}\n\n`;
        case 'h4': return `#### ${children().trim()}\n\n`;
        case 'h5': return `##### ${children().trim()}\n\n`;
        case 'h6': return `###### ${children().trim()}\n\n`;

        case 'p': {
          const text = children().trim();
          return text ? `${text}\n\n` : '';
        }

        case 'br': return '\n';
        case 'hr': return '\n---\n\n';

        case 'strong':
        case 'b': {
          const inner = children().trim();
          return inner ? `**${inner}**` : '';
        }

        case 'em':
        case 'i': {
          const inner = children().trim();
          return inner ? `*${inner}*` : '';
        }

        case 'code': return `\`${children()}\``;

        case 'pre': {
          const inner = children().trim();
          return `\`\`\`\n${inner}\n\`\`\`\n\n`;
        }

        case 'blockquote': {
          const inner = children().trim();
          return inner.split('\n').map(l => `> ${l}`).join('\n') + '\n\n';
        }

        case 'a': return children(); // keep link text, drop URL

        case 'ul':
        case 'ol': {
          const indent = '  '.repeat(listDepth);
          let num = 0;
          const lines = [];
          for (const child of node.childNodes) {
            if (child.nodeType !== 1) continue;
            if (child.tagName.toLowerCase() !== 'li') continue;
            num++;
            const bullet = tag === 'ol' ? `${num}.` : '-';
            // Render the li contents; nested lists will pick up listDepth + 1 naturally
            const content = domToMarkdown(child, listDepth + 1).trim();
            // The first line of content gets the bullet; subsequent lines get indented
            const contentLines = content.split('\n');
            lines.push(`${indent}${bullet} ${contentLines[0]}`);
            for (let i = 1; i < contentLines.length; i++) {
              if (contentLines[i].trim()) lines.push(`${indent}  ${contentLines[i]}`);
              else if (i < contentLines.length - 1) lines.push(''); // preserve blank lines between sub-items
            }
          }
          return lines.join('\n') + '\n\n';
        }

        case 'li': return children(); // handled by parent ul/ol

        case 'table': {
          // Minimal table support: header row + data rows
          const rows = Array.from(node.querySelectorAll('tr'));
          if (!rows.length) return children();
          const renderRow = row =>
            '| ' + Array.from(row.querySelectorAll('th, td')).map(cell => domToMarkdown(cell, listDepth).trim()).join(' | ') + ' |';
          const header = renderRow(rows[0]);
          const sep = '| ' + Array.from(rows[0].querySelectorAll('th, td')).map(() => '---').join(' | ') + ' |';
          const body = rows.slice(1).map(renderRow);
          return [header, sep, ...body].join('\n') + '\n\n';
        }

        default:
          return children(); // div, span, section, article, etc. — just recurse
      }
    }

    function htmlToMarkdown(html) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      return domToMarkdown(doc.body)
        .replace(/[ \t]+\n/g, '\n')    // trailing spaces on lines
        .replace(/\n{3,}/g, '\n\n')    // collapse 3+ blank lines to 2
        .trim();
    }

    document.getElementById('notes').addEventListener('paste', (e) => {
      const html = e.clipboardData && e.clipboardData.getData('text/html');
      if (!html || !html.trim()) return; // no rich text — let browser handle normally

      e.preventDefault();

      const md = htmlToMarkdown(html);
      if (!md) return; // conversion produced nothing useful, fall back to default

      // Insert at cursor position (replaces selection if any)
      const ta = e.target;
      const start = ta.selectionStart;
      const end   = ta.selectionEnd;
      const before = ta.value.slice(0, start);
      const after  = ta.value.slice(end);
      ta.value = before + md + after;
      const cursor = start + md.length;
      ta.setSelectionRange(cursor, cursor);

      // Show confirmation badge
      const notice = document.getElementById('paste-notice');
      notice.textContent = '✓ Formatting preserved as Markdown';
      notice.classList.remove('hidden');
    });
  </script>
</body>
</html>
