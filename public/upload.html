<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Session Notes — D&amp;D Wiki</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1510;
      color: #d4c89a;
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #221e18;
      border: 1px solid #c9a84c44;
      border-radius: 6px;
      padding: 2.5rem;
      width: 100%;
      max-width: 700px;
    }

    h1 {
      font-size: 1.6rem;
      color: #c9a84c;
      margin-bottom: 0.4rem;
      letter-spacing: 0.04em;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: #8c7b5a;
      margin-bottom: 1.6rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #a89870;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    textarea {
      width: 100%;
      min-height: 280px;
      background: #14110e;
      border: 1px solid #c9a84c44;
      border-radius: 4px;
      color: #d4c89a;
      font-family: 'Georgia', serif;
      font-size: 0.95rem;
      line-height: 1.6;
      padding: 1rem;
      resize: vertical;
      outline: none;
    }

    textarea:focus { border-color: #c9a84c88; }

    button[type="submit"] {
      margin-top: 1.2rem;
      background: #c9a84c;
      color: #1a1510;
      border: none;
      border-radius: 4px;
      padding: 0.7rem 2rem;
      font-family: 'Georgia', serif;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: background 0.15s;
    }

    button[type="submit"]:hover { background: #e0bc60; }
    button[type="submit"]:disabled { background: #5a4e30; color: #8c7b5a; cursor: not-allowed; }

    /* Loading state */
    #state-loading {
      text-align: center;
      padding: 3rem 0;
    }

    .spinner {
      display: inline-block;
      width: 48px;
      height: 48px;
      border: 4px solid #c9a84c22;
      border-top-color: #c9a84c;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 1.2rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #state-loading p {
      color: #8c7b5a;
      font-style: italic;
    }

    /* Visibility helpers */
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card">

    <!-- Input state -->
    <div id="state-input">
      <h1>Upload Session Notes</h1>
      <p class="subtitle">Paste your session notes below. Claude will identify which wiki pages to update and propose changes for your review.</p>

      <form id="upload-form" action="/upload/analyze" method="POST">
        <label for="notes">Session Notes</label>
        <textarea
          id="notes"
          name="notes"
          placeholder="The party arrived at Stormhaven under cover of night…"
          required
        ></textarea>

        <button type="submit" id="submit-btn">Analyze Notes</button>
      </form>
    </div>

    <!-- Loading state -->
    <div id="state-loading" class="hidden">
      <div class="spinner"></div>
      <p>Claude is reading your notes and identifying wiki changes&hellip;</p>
    </div>

  </div>

  <script>
    const form = document.getElementById('upload-form');
    const inputState = document.getElementById('state-input');
    const loadingState = document.getElementById('state-loading');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', () => {
      submitBtn.disabled = true;
      inputState.classList.add('hidden');
      loadingState.classList.remove('hidden');
    });
  </script>
</body>
</html>
